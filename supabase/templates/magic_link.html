<!-- {{ .RedirectTo }} is ".../auth/callback?next=..." (set by the login form), so this works on localhost, previews and production.
     Paste into Supabase → Authentication → Email Templates → "Magic Link".
     Sends BOTH a link (works in any browser, via token_hash) and a 6-digit code. -->
<h2>Your Stroopwafel Ventures sign-in 🧇</h2>
<p>Click to sign in:</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Sign in to Stroopwafel Ventures</a></p>
<p>Or enter this code on the sign-in page:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p style="color:#7a6450;font-size:12px">If you didn't ask for this, you can ignore it.</p>
